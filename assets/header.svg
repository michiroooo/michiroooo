<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Michiro Hirai - GitHub profile header">
  <title>Michiro Hirai</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="48%" stop-color="#17224d"/>
      <stop offset="100%" stop-color="#0e3a45"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.055"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="900" height="220" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <circle cx="760" cy="40" r="220" fill="url(#glowA)"/>
    <circle cx="120" cy="215" r="200" fill="url(#glowB)"/>
    <rect width="900" height="220" fill="url(#dots)"/>

    <!-- EDIT ME: display name -->
    <text x="56" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Michiro Hirai</text>

    <text x="58" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#67e8f9" letter-spacing="0.6">@michiroooo</text>

    <rect x="58" y="146" width="44" height="2" rx="1" fill="#334155"/>

    <!-- EDIT ME: one-line tagline -->
    <text x="58" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="17" fill="#cbd5e1">Engineering Manager at a small AI startup</text>

    <g opacity="0.9">
      <rect x="0" y="216" width="900" height="4" fill="#1e293b"/>
      <rect x="-320" y="216" width="320" height="4" fill="url(#sweep)">
        <animate attributeName="x" from="-320" to="900" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
